  /* ---------- theme tokens ---------- */

  .reveal.in { opacity: 1; transform: none; }

  @media print {

    .layout { display: block; max-width: none; padding: 0; }
    .glass, .sidebar { background: #fff !important; box-shadow: none !important; border: 1px solid #ddd !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }

    .bullets li, .edu-school, .honor-name, .contact a, .contact .c-row { color: #333 !important; }
    .reveal { opacity: 1 !important; transform: none !important; }
    a { text-decoration: none; color: inherit; }
  }
</style>

      phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
      pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
      github: '<path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>',
      linkedin: '<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/>'
    };
    function svg(name) {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>';
    }
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
      });
    }
    function initials(name) {
      var parts = String(name).replace(/,/g, " ").split(/\s+/).filter(Boolean);
      return ((parts[0] || "")[0] || "") + ((parts[1] || "")[0] || "");
    }
    function digits(p) { return p.replace(/[^\d+]/g, ""); }
    function handle(url) { return String(url).replace(/\/+$/, "").split("/").pop(); }

    var c = data.contact || {};

    /* ---- sidebar ---- */
    var contactRows = [];
    if (c.location) contactRows.push('<li><span class="c-row">' + svg("pin") + esc(c.location) + "</span></li>");
    (c.phones || []).forEach(function (p) {
      contactRows.push('<li><a href="tel:' + esc(digits(p)) + '">' + svg("phone") + esc(p) + "</a></li>");
    });
    if (c.email) contactRows.push('<li><a href="mailto:' + esc(c.email) + '">' + svg("mail") + esc(c.email) + "</a></li>");
    if (c.github) contactRows.push('<li><a href="' + esc(c.github) + '" target="_blank" rel="noopener">' + svg("github") + esc(handle(c.github)) + "</a></li>");
    if (c.linkedin) contactRows.push('<li><a href="' + esc(c.linkedin) + '" target="_blank" rel="noopener">' + svg("linkedin") + "in/" + esc(handle(c.linkedin)) + "</a></li>");

    var skillsHtml = (data.skillGroups || []).map(function (g) {
      return '<div class="skillgroup"><h4>' + esc(g.label) + '</h4><div class="chips">' +
        (g.items || []).map(function (it) { return '<span class="chip">' + esc(it) + "</span>"; }).join("") +
        "</div></div>";
    }).join("");

    var sidebar =
      '<aside class="sidebar reveal">' +
        '<div class="identity">' +
          '<div class="monogram" aria-hidden="true">' + esc(initials(data.name)) + "</div>" +
          '<div>' +
            '<h1 class="name">' + esc(data.name) + "</h1>" +
            (data.headline ? '<div class="headline">' + esc(data.headline) + "</div>" : "") +
            (c.location ? '<div class="locus">' + esc(c.location) + "</div>" : "") +
          "</div>" +
        "</div>" +
        '<ul class="contact side-block" style="border-top:none;padding-top:0">' + contactRows.join("") + "</ul>" +
        (skillsHtml ? '<div class="side-block"><div class="kicker">Skills</div>' + skillsHtml + "</div>" : "") +
      "</aside>";

    /* ---- experience ---- */
    var jobsHtml = (data.jobs || []).map(function (job) {
      var projects = (job.projects || []).map(function (pr) {
        var bl = (pr.bullets || []).map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("");
        return '<div class="project">' +
          (pr.title ? '<div class="project-title">' + esc(pr.title) + "</div>" : "") +
          (bl ? '<ul class="bullets">' + bl + "</ul>" : "") + "</div>";
      }).join("");
      return '<div class="job">' +
        '<div class="job-head">' +
          '<div><span class="job-role">' + esc(job.role) + '</span> &middot; <span class="job-company">' + esc(job.company) + "</span></div>" +
          '<span class="job-dates">' + esc(job.dates) + "</span>" +
        "</div>" + projects + "</div>";
    }).join("");

    var eduHtml = (data.education || []).map(function (e) {
      return '<div class="edu-item"><span class="edu-degree">' + esc(e.degree) + '</span><span class="edu-school">' + esc(e.school) + "</span></div>";
    }).join("");

    var honorsHtml = (data.honors || []).map(function (h) {
      return '<div class="honor-item"><span class="honor-name">' + esc(h.name) + '</span><span class="honor-year">' + esc(h.year) + "</span></div>";
    }).join("");

    var content = '<div class="content">';
    if (jobsHtml) content += '<section class="section glass reveal"><header><div class="kicker">Career</div><h2>Experience</h2></header><div class="timeline">' + jobsHtml + "</div></section>";
    if (eduHtml) content += '<section class="section glass reveal"><header><div class="kicker">Academic</div><h2>Education</h2></header>' + eduHtml + "</section>";
    if (honorsHtml) content += '<section class="section glass reveal"><header><div class="kicker">Recognition</div><h2>Honors &amp; Certifications</h2></header>' + honorsHtml + "</section>";
    content += "</div>";

    var app = document.getElementById("app");
    app.innerHTML = sidebar + content;
    document.title = data.name.replace(/,\s*/g, " ").replace(/\b\w+/g, function (w) { return w[0] + w.slice(1).toLowerCase(); }) +
      (data.headline ? " — " + data.headline : "");

    /* ---- reveal on scroll ---- */
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var els = app.querySelectorAll(".reveal");
    if (reduce || !("IntersectionObserver" in window)) {
      els.forEach(function (el) { el.classList.add("in"); });
    } else {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
      }, { threshold: 0.08 });
      els.forEach(function (el, i) { el.style.transitionDelay = Math.min(i * 70, 280) + "ms"; io.observe(el); });
    }
  })();
  </script>
</body>
</html>
